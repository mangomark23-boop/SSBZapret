[package]
name = "ssbzapret"
version = "0.1.0"
description = "SSBZapret — утилита обхода DPI (Stronger · Smarter · Better)"
authors = ["mark"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "ssbzapret"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
chrono = "0.4"
dirs = "5"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
